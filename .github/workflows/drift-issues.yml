name: Drift Issues

# Reconciles the committed drift reports with this repository's issues:
# tools/New-PfbDriftIssue.ps1 files one issue per new group of findings, appends new
# findings to a group's open issue, notes findings that stop being reported, and labels an
# issue status:resolved-upstream when none of its findings remain. It never closes an issue.
#
# TWO WAYS IN.
# - workflow_dispatch: a DRY RUN BY DEFAULT. The `apply` input defaults to false, so a
#   dispatch with no choices made prints the plan to the job summary and writes nothing.
# - push to main changing a drift report: THE SPEC-RELEASE EVENT, and it APPLIES.
#   update-api-capability-map.yml finds a new REST version and opens a PR from
#   automated/update-api-capability-map; merging that PR is the human review of what
#   changed, so the run it starts writes (capped by -MaxCreate, 10 new issues a run).
#   ONLY THAT MERGE COUNTS. A feature merge also commits regenerated reports, so the gate
#   step asks GitHub which PR the pushed commit belongs to
#   (tools/Test-PfbCapabilityMapMerge.ps1) and the reconcile step is skipped unless it is
#   the capability-map PR, from this repository, into main. A skipped run is green.
#   -AcceptMassVanish is never passed: a release that makes most findings vanish stops the
#   run for a human, as it would on a dispatch.
#   push triggers only fire for a workflow file on the default branch, and never from a
#   fork's main (the job-level guard below).
#
# NO SECRETS. The built-in GITHUB_TOKEN with `issues: write` is all the reconciler needs,
# and `pull-requests: read` is all the gate needs; gh is preinstalled on the runner and
# reads GH_TOKEN. Nothing here needs a repository secret.
#
# NOT CANCELLED MID-RUN. An applying run writes issue by issue; cancelling one halfway
# leaves some of its writes made. The next run would reconcile them, but there is no reason
# to create that state on purpose, so a second run queues behind the first.
#
# Values reach the scripts through env:, never through ${{ }} inside a run: block.
#
# No Pester here: Tests/New-PfbDriftIssue.Tests.ps1, Tests/PfbDriftIssueTools.Tests.ps1 and
# Tests/Test-PfbCapabilityMapMerge.Tests.ps1 already run on every pull request, on both
# editions, in cross-platform-tests.yml.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to GitHub. Leave unticked for a dry run that only prints the plan.'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Reports/PfbApiDriftReport.json'
      - 'Reports/PfbDeadKeyReport.json'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: drift-issues
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile drift findings with issues
    # A push to a fork's main must never file issues on that fork. A dispatch anywhere is
    # still allowed, and is a dry run unless apply is ticked.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'dmann000/fb-powershell'
    runs-on: ubuntu-latest
    # A few hundred API calls at most, and the create cap bounds the writes. The timeout is
    # a stuck-network guard, not a budget.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this push the capability-map merge?
        id: gate
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_REPO: ${{ github.repository }}
          DRIFT_SHA: ${{ github.sha }}
        run: |
          ./tools/Test-PfbCapabilityMapMerge.ps1 -Repo $env:DRIFT_REPO -Sha $env:DRIFT_SHA -GhCommand gh

      - name: Reconcile (applies on the push path; a dispatch is a dry run unless apply is ticked)
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.is_capability_map_merge == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_REPO: ${{ github.repository }}
          DRIFT_APPLY: ${{ inputs.apply }}
          DRIFT_EVENT: ${{ github.event_name }}
        run: |
          $params = @{ Repo = $env:DRIFT_REPO; GhCommand = 'gh' }
          if ($env:DRIFT_EVENT -eq 'push' -or $env:DRIFT_APPLY -eq 'true') { $params['Apply'] = $true }
          ./tools/New-PfbDriftIssue.ps1 @params
